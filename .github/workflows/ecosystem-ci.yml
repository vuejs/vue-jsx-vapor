name: ecosystem-ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

jobs:
  ecosystem-ci:
    name: ecosystem-ci (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        suite:
          - antdv-next
          - naive-ui
          - vant
          - vuetify
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install root deps
        run: pnpm install

      - name: Build vue-jsx-vapor
        run: pnpm run build

      - name: Run ${{ matrix.suite }} suite
        run: pnpm test:eco ${{ matrix.suite }}
        env:
          TZ: Asia/Shanghai
