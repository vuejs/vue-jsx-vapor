packages:
  - packages/*
  - playground
  - docs
  - benchmark
  - ecosystem-ci

patchedDependencies:
  '@vue-macros/volar': patches/@vue-macros__volar.patch

catalog:
  '@nuxt/kit': ^3.21.4
  '@nuxt/schema': ^3.21.4

  '@types/hash-sum': ^1.0.2

  '@vue-macros/volar': ^3.1.4

  '@vue/shared': 3.6.0-rc.7
  hash-sum: ^2.0.0
  unplugin: ^3.0.0
  unplugin-utils: ^0.3.1
  vite: ^8.0.10
  vitest: ^4.1.5
  vue: 3.6.0-rc.7

allowBuilds:
  esbuild: true
  vue-demi: true

minimumReleaseAgeExclude:
  - jsx-repl@0.0.18
  - '@vue/compiler-core@3.6.0-rc.7'
  - '@vue/compiler-dom@3.6.0-rc.7'
  - '@vue/compiler-sfc@3.6.0-rc.7'
  - '@vue/compiler-ssr@3.6.0-rc.7'
  - '@vue/compiler-vapor@3.6.0-rc.7'
  - '@vue/reactivity@3.6.0-rc.7'
  - '@vue/runtime-core@3.6.0-rc.7'
  - '@vue/runtime-dom@3.6.0-rc.7'
  - '@vue/runtime-vapor@3.6.0-rc.7'
  - '@vue/server-renderer@3.6.0-rc.7'
  - '@vue/shared@3.6.0-rc.7'
  - vue@3.6.0-rc.7
packageExtensions:
  ts-macro@0.3.7:
    peerDependencies:
      typescript: '*'
  '@ts-macro/tsc@0.3.7':
    peerDependencies:
      typescript: '*'
